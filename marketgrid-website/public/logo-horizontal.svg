<svg width="900" height="200" viewBox="0 0 900 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="premiumGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001E3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066CC;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Logo Icon -->
  <g id="icon" transform="translate(40, 50)">
    <!-- Left pillar -->
    <rect x="8" y="18" width="12" height="64" fill="#001E3C" rx="1.5"/>
    <!-- Right pillar -->
    <rect x="80" y="18" width="12" height="64" fill="#001E3C" rx="1.5"/>
    <!-- Top bar -->
    <rect x="8" y="18" width="84" height="12" fill="#001E3C" rx="1.5"/>
    <!-- Center peak -->
    <path d="M 50 18 L 40 46 L 45 46 L 50 30 L 55 46 L 60 46 Z" fill="#0066CC"/>
    <!-- Grid lines -->
    <line x1="30" y1="18" x2="30" y2="82" stroke="#0066CC" stroke-width="1.2" opacity="0.25"/>
    <line x1="50" y1="18" x2="50" y2="82" stroke="#0066CC" stroke-width="1.2" opacity="0.25"/>
    <line x1="70" y1="18" x2="70" y2="82" stroke="#0066CC" stroke-width="1.2" opacity="0.25"/>
    <!-- Accents -->
    <circle cx="8" cy="18" r="4" fill="#0066CC" opacity="0.9"/>
    <circle cx="92" cy="18" r="4" fill="#0066CC" opacity="0.9"/>
    <circle cx="8" cy="82" r="4" fill="#001E3C" opacity="0.8"/>
    <circle cx="92" cy="82" r="4" fill="#001E3C" opacity="0.8"/>
  </g>

  <!-- Company Name - Premium Typography -->
  <g id="wordmark">
    <text x="190" y="112" font-family="'Playfair Display', Georgia, serif" font-size="56" font-weight="700" fill="#001E3C" letter-spacing="-1.5">
      MARKETGRID
    </text>
  </g>

  <!-- Tagline - Refined and professional -->
  <text x="190" y="142" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="14" font-weight="500" fill="#6B7280" letter-spacing="4">
    STRATEGIC DEMAND INTELLIGENCE
  </text>
</svg>
