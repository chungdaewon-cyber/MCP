<svg width="900" height="200" viewBox="0 0 900 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Deloitte-inspired Horizontal Grid Logo -->
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#86BC24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B9B1E;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Grid Icon -->
  <g id="icon" transform="translate(35, 40)">
    <!-- Data Grid Background - visible structure -->
    <g id="gridStructure" opacity="0.12">
      <!-- Vertical grid lines -->
      <line x1="20" y1="15" x2="20" y2="105" stroke="#000000" stroke-width="1"/>
      <line x1="40" y1="15" x2="40" y2="105" stroke="#000000" stroke-width="1"/>
      <line x1="60" y1="15" x2="60" y2="105" stroke="#000000" stroke-width="1"/>
      <line x1="80" y1="15" x2="80" y2="105" stroke="#000000" stroke-width="1"/>
      <line x1="100" y1="15" x2="100" y2="105" stroke="#000000" stroke-width="1"/>
      <!-- Horizontal grid lines -->
      <line x1="0" y1="35" x2="120" y2="35" stroke="#000000" stroke-width="1"/>
      <line x1="0" y1="55" x2="120" y2="55" stroke="#000000" stroke-width="1"/>
      <line x1="0" y1="75" x2="120" y2="75" stroke="#000000" stroke-width="1"/>
      <line x1="0" y1="95" x2="120" y2="95" stroke="#000000" stroke-width="1"/>
    </g>

    <!-- Main Grid Frame - Bold outline -->
    <rect x="0" y="15" width="120" height="90" fill="none" stroke="#000000" stroke-width="2.5"/>

    <!-- Data Cells - Ascending demand visualization -->
    <g id="dataCells">
      <!-- Row 1 - Low demand (bottom) -->
      <rect x="0" y="95" width="20" height="10" fill="#000000" opacity="0.15"/>
      <rect x="20" y="95" width="20" height="10" fill="#000000" opacity="0.20"/>

      <!-- Row 2 - Medium demand -->
      <rect x="20" y="75" width="20" height="20" fill="#000000" opacity="0.30"/>
      <rect x="40" y="75" width="20" height="20" fill="#000000" opacity="0.35"/>

      <!-- Row 3 - High demand -->
      <rect x="40" y="55" width="20" height="20" fill="#000000" opacity="0.45"/>
      <rect x="60" y="55" width="20" height="20" fill="#86BC24" opacity="0.60"/>

      <!-- Row 4 - Peak demand (Deloitte Green) -->
      <rect x="60" y="35" width="20" height="20" fill="#86BC24" opacity="0.75"/>
      <rect x="80" y="35" width="20" height="20" fill="#86BC24" opacity="0.90"/>
      <rect x="100" y="35" width="20" height="20" fill="#86BC24"/>
    </g>

    <!-- Ascending trend line -->
    <polyline
      points="10,100 30,90 50,75 70,55 90,40 110,28"
      fill="none"
      stroke="#86BC24"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Data points on trend line -->
    <circle cx="10" cy="100" r="2.5" fill="#000000"/>
    <circle cx="30" cy="90" r="2.5" fill="#000000"/>
    <circle cx="50" cy="75" r="2.5" fill="#86BC24"/>
    <circle cx="70" cy="55" r="3" fill="#86BC24"/>
    <circle cx="90" cy="40" r="3.5" fill="#86BC24"/>
    <circle cx="110" cy="28" r="4" fill="#86BC24"/>
  </g>

  <!-- Company Name - Bold Professional Typography -->
  <g id="wordmark">
    <text x="210" y="108" font-family="'Arial Black', 'Arial', sans-serif" font-size="52" font-weight="900" fill="#000000" letter-spacing="-0.5">
      MARKETGRID
    </text>
  </g>

  <!-- Tagline - Professional and clean -->
  <text x="210" y="138" font-family="'Arial', 'Helvetica Neue', sans-serif" font-size="13" font-weight="600" fill="#4B5563" letter-spacing="3.5">
    AI-POWERED DEMAND INTELLIGENCE
  </text>
</svg>
