<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium gradient - Deep Navy to Professional Blue -->
    <linearGradient id="premiumGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001E3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066CC;stop-opacity:1" />
    </linearGradient>

    <!-- Subtle shine effect -->
    <radialGradient id="shineEffect" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#0066CC;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#001E3C;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Subtle background -->
  <circle cx="100" cy="100" r="92" fill="url(#shineEffect)"/>

  <!-- Main geometric monogram - Abstract "M" representing data/grid -->
  <g id="mgMonogram">
    <!-- Left pillar - solid and strong -->
    <rect x="48" y="58" width="14" height="84" fill="#001E3C" rx="2"/>

    <!-- Right pillar -->
    <rect x="138" y="58" width="14" height="84" fill="#001E3C" rx="2"/>

    <!-- Top connecting bar -->
    <rect x="48" y="58" width="104" height="14" fill="#001E3C" rx="2"/>

    <!-- Center peak - distinctive element (data ascending) -->
    <path d="M 100 58 L 85 95 L 92 95 L 100 76 L 108 95 L 115 95 Z" fill="#0066CC"/>

    <!-- Subtle grid pattern - minimalist -->
    <line x1="76" y1="58" x2="76" y2="142" stroke="#0066CC" stroke-width="1.5" opacity="0.25"/>
    <line x1="100" y1="58" x2="100" y2="142" stroke="#0066CC" stroke-width="1.5" opacity="0.25"/>
    <line x1="124" y1="58" x2="124" y2="142" stroke="#0066CC" stroke-width="1.5" opacity="0.25"/>

    <!-- Horizontal precision lines -->
    <line x1="48" y1="90" x2="152" y2="90" stroke="#0066CC" stroke-width="1" opacity="0.15"/>
    <line x1="48" y1="110" x2="152" y2="110" stroke="#0066CC" stroke-width="1" opacity="0.15"/>

    <!-- Corner accents - premium detail -->
    <circle cx="48" cy="58" r="5" fill="#0066CC" opacity="0.9"/>
    <circle cx="152" cy="58" r="5" fill="#0066CC" opacity="0.9"/>
    <circle cx="48" cy="142" r="5" fill="#001E3C" opacity="0.8"/>
    <circle cx="152" cy="142" r="5" fill="#001E3C" opacity="0.8"/>

    <!-- Data nodes - subtle -->
    <circle cx="76" cy="90" r="2.5" fill="#0066CC" opacity="0.6"/>
    <circle cx="124" cy="90" r="2.5" fill="#0066CC" opacity="0.6"/>
    <circle cx="100" cy="110" r="2.5" fill="#0066CC" opacity="0.4"/>
  </g>
</svg>
