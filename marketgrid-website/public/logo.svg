<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Grid Pattern -->
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>

    <pattern id="gridPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Grid Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#gridPattern)" opacity="0.3"/>

  <!-- Main M Shape (formed by grid nodes) -->
  <g id="mgLogo">
    <!-- Left vertical line -->
    <line x1="50" y1="70" x2="50" y2="130" stroke="url(#brandGradient)" stroke-width="8" stroke-linecap="round"/>

    <!-- Left diagonal -->
    <line x1="50" y1="70" x2="100" y2="100" stroke="url(#brandGradient)" stroke-width="8" stroke-linecap="round"/>

    <!-- Right diagonal -->
    <line x1="100" y1="100" x2="150" y2="70" stroke="url(#brandGradient)" stroke-width="8" stroke-linecap="round"/>

    <!-- Right vertical line -->
    <line x1="150" y1="70" x2="150" y2="130" stroke="url(#brandGradient)" stroke-width="8" stroke-linecap="round"/>

    <!-- Data points (nodes) -->
    <circle cx="50" cy="70" r="6" fill="#3B82F6"/>
    <circle cx="50" cy="130" r="6" fill="#3B82F6"/>
    <circle cx="100" cy="100" r="6" fill="#06B6D4"/>
    <circle cx="150" cy="70" r="6" fill="#3B82F6"/>
    <circle cx="150" cy="130" r="6" fill="#3B82F6"/>

    <!-- Grid connection indicators (smaller dots) -->
    <circle cx="75" cy="85" r="3" fill="#06B6D4" opacity="0.6"/>
    <circle cx="125" cy="85" r="3" fill="#06B6D4" opacity="0.6"/>
    <circle cx="100" cy="115" r="3" fill="#06B6D4" opacity="0.4"/>
  </g>
</svg>
